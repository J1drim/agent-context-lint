version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 10
    groups:
      development-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch
    commit-message:
      prefix: deps
